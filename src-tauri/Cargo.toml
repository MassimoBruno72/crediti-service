[package]
name = "crediti-service"
version = "1.0.0"
description = "Crediti Service - registro incassi"
edition = "2021"

[lib]
name = "crediti_service_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
